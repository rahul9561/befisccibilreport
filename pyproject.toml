[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "befisc-reportforge"
version = "1.0.3"
description = "JSON-driven PDF engine for TransUnion CIBIL consumer credit reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0,<5",
    "svglib>=1.5,<3",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pymupdf>=1.23"]

[project.scripts]
befisc-reportforge = "befisc_reportforge.__main__:main"

[tool.setuptools.packages.find]
include = ["befisc_reportforge*"]

# Logo + Roboto fonts are shipped inside the package so every install has them.
[tool.setuptools.package-data]
befisc_reportforge = ["assets/*.svg", "assets/Roboto/*.txt", "assets/Roboto/static/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
